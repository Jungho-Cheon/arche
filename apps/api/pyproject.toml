[project]
name = "opentology-api"
version = "0.1.0"
description = "Opentology MVP API — graph primitives + ingest 파이프라인"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "neo4j>=5.20.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "python-ulid>=2.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "pathspec>=0.12.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12",
    "testcontainers[neo4j]>=4.7.0",
    "respx>=0.21.0",
]

[project.scripts]
opentology = "opentology_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentology_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: end-to-end test that hits real OpenAI API + Neo4j (set RUN_LIVE_TESTS=1 to enable)",
    "integration: integration test that spins up Neo4j via testcontainers",
]
