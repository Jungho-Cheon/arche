name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 린트와 테스트 (uv.lock 고정)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv 는 부동 major 태그(v9)를 내지 않는다. 전체 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: 린트
        working-directory: apps/api
        run: uv run --extra dev ruff check src/ tests/

      - name: 단위 테스트
        working-directory: apps/api
        run: uv run --extra dev pytest tests/unit -q

      # 두 파일을 함께 돌린다. 앞은 fake graph 로 핸드셰이크와 응답 모양만 보고, 뒤는
      # 배포되는 기본 경로(임베디드 Kuzu + 진짜 적재)를 재기동까지 통과시킨다. 나머지
      # integration 은 Neo4j 컨테이너가 필요해 여기서 돌리지 않는다.
      - name: MCP e2e (fake graph + 임베디드 저장소)
        working-directory: apps/api
        run: >
          uv run --extra dev pytest -q
          tests/integration/test_mcp_stdio_e2e.py
          tests/integration/test_embedded_mcp_e2e.py

      - name: 생성된 레퍼런스 표가 코드와 일치하는지
        run: uv run --project apps/api arche docs gen-reference --check

      # eval 은 키가 있어야 도는 live 만 빼고 전부 돌린다. 여기에 없던 동안 판정 매핑이
      # 컬럼 하나를 빠뜨리는 결함과 포트를 안 따라간 더블 셋이 조용히 쌓여 있었다.
      - name: eval 린트와 테스트
        working-directory: eval
        run: |
          uv run --extra dev ruff check src/ tests/
          uv run --extra dev pytest tests/ -q --ignore=tests/live

  fresh-install:
    name: 갓 설치한 환경에서 MCP 기동
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv 는 부동 major 태그(v9)를 내지 않는다. 전체 버전으로 고정한다.
      - uses: astral-sh/setup-uv@v9.0.0

      # uv.lock 을 쓰지 않는 경로다. 사용자가 uvx 로 받는 의존성 조합을 그대로 재현해,
      # 상한 없는 의존성이 새 major 를 물어와 서버가 죽는 일을 막는다.
      - name: 잠금 없이 설치해 서버를 띄워 본다
        run: python3 scripts/smoke_mcp_boot.py uvx --from ./apps/api arche

  docs:
    name: 문서 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 루트에 package.json 이 없어 packageManager 를 못 읽는다. 버전을 직접 준다.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arche/docs build
