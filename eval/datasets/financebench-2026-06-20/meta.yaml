dataset_id: financebench-2026-06-20
domain: SEC 10-K Annual Reports (FinanceBench open-source subset — 6 large-cap US companies)
language: en
author: opentology-eval
created_at: "2026-06-20"
description: |
  Opentology M6.5 검증용 1M-token 외부 standard 데이터셋.
  Patronus AI 의 FinanceBench (https://github.com/patronus-ai/financebench, 150 QA
  open-source split) 에서 상위 6 개 10-K (AMD / AMERICANEXPRESS / BOEING / PEPSICO /
  AMCOR / JOHNSON_JOHNSON, 모두 2022-2023 회계연도) 와 그 문서에 직접 연결된 33 QA 를
  선택해 5-option MCQ 로 변환했다.

  변환 절차:
    1. financebench_open_source.jsonl 에서 위 6 doc 으로 필터링 → 33 QA 추출.
    2. gpt-4.1-mini 로 정답 옵션 + 3 개의 plausible-but-wrong distractor 자동 생성
       (각 distractor 에 failure_mode_tested 라벨 부여).
    3. "Insufficient information / cannot determine (정보 부족 / 알 수 없음)" 옵션을
       모든 질문의 5 번째 옵션으로 추가 — opentology-eval lint 의 hard rule
       (rule_info_insufficient_option_present) 을 영어/한국어 둘 다 통과시키기 위한
       이중 표기.
    4. domain_pattern / hops_required 는 결정론적 휴리스틱으로 재분류 —
       (multi-year 비교 → multi_hop, metrics-generated → cross_source/multi_hop 등).
       단순 information extraction 만 single_doc/hops=1.

  본 데이터셋 한계:
    - synonym_alias 패턴 없음 (FinanceBench QA 가 부서별 별칭 변형을 포함하지 않음).
      M6.5 측정에서 Combined RAG 의 별칭 환원 우위는 측정 불가.
    - 모든 QA 의 evidence 는 *동일 10-K 내부* 에 있음 (cross-doc 추론 측정 불가).
    - English 코퍼스. 95K 측정 (commerce-verbose-20260618, Korean) 과 언어 다름.

corpus:
  file_count: 6
  total_tokens_estimate: 980000
  formats: [md]
  notes: |
    각 파일은 원본 PDF (FinanceBench/pdfs/<doc_name>.pdf) 를 pypdf 로 페이지 텍스트
    추출한 markdown. 표 / 차트는 page-by-page 텍스트로 흡수 — 일부 숫자 정렬은
    원본 layout 과 다를 수 있음 (재무제표 표는 컬럼 분리가 무너지는 케이스 있음).

    문서별 토큰 분포 (4 char ≈ 1 token 추정):
      AMD_2022_10K           : ~103K
      AMERICANEXPRESS_2022_10K: ~205K
      BOEING_2022_10K        : ~127K
      PEPSICO_2022_10K       : ~294K
      AMCOR_2023_10K         : ~121K
      JOHNSON_JOHNSON_2022_10K: ~130K
      TOTAL                  : ~980K

questions:
  count: 33
  by_domain_pattern:
    multi_hop: 13
    single_doc: 11
    cross_source: 9
    synonym_alias: 0
  by_hops_required:
    "1": 11
    "2": 7
    "3": 15
  by_doc:
    AMD_2022_10K: 7
    AMERICANEXPRESS_2022_10K: 7
    BOEING_2022_10K: 7
    PEPSICO_2022_10K: 5
    AMCOR_2023_10K: 4
    JOHNSON_JOHNSON_2022_10K: 3
  by_question_type_original:
    domain-relevant: 24
    novel-generated: 7
    metrics-generated: 2

source:
  upstream_dataset: patronus-ai/financebench
  upstream_url: https://github.com/patronus-ai/financebench
  upstream_split: financebench_open_source.jsonl
  license: CC BY 4.0
  selection_strategy: |
    1M ± 100K token 코퍼스 목표 + 가능한 한 많은 QA 적중. 상위 5 개 referenced doc
    (AMD/AXP/BA/PEP/AMCOR, 30 QA) 가 850K → JOHNSON_JOHNSON 추가로 980K + 3 QA.
