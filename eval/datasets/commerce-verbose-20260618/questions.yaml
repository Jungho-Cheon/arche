dataset_id: commerce-verbose-20260618
questions:
  - id: Q01
    question: >-
      로열티팀이 "골드 등급" 이라 부르는 회원이 명품을 샀다. 그런데 이 회원은 "비활성 등급" 에서 골드로 복귀한 지 20 일째다.
      이 명품의 반품 가능 기간은 며칠인가?
    domain_pattern: multi_hop
    hops_required: 3
    options:
      - id: a
        text: 30 일. 골드(VIP) 가 명품을 사면 R2 에 따라 반품이 7 일에서 30 일로 연장되기 때문이다.
        is_correct: false
        failure_mode_tested: missed_hop
      - id: b
        text: 7 일. 휴면(비활성)에서 골드로 복귀한 지 30 일 이내라 명품 반품 연장이 적용되지 않고 기본 7 일이다.
        is_correct: true
        failure_mode_tested: null
      - id: c
        text: 30 일. 복귀 회원도 골드이기만 하면 카테고리 무관하게 30 일이 보장된다.
        is_correct: false
        failure_mode_tested: synonym_confusion
      - id: d
        text: 14 일. 복귀 30 일 이내 명품은 기본의 절반인 14 일로 처리된다.
        is_correct: false
        failure_mode_tested: numeric_error
      - id: e
        text: 정보 부족 / 알 수 없음. 복귀 시점과 반품 한도의 관계가 코퍼스에 명시되지 않았다.
        is_correct: false
        failure_mode_tested: retrieval_failure
    reference_reasoning: >-
      loyalty tier-rulebook §5.2 (비활성→골드 복귀 30 일 유예) → hq-pm policy-matrix §3 (R2 휴면 복귀 예외) →
      cs-logistics return-refund-flowchart §3 (명품+V회원 복귀 30 일 이내는 7 일). "골드 등급"="비활성 등급" 별칭을
      VIP/Dormant 로 환원하고, 복귀 30 일 이내 예외 조항을 결합해야 7 일이 나온다.
    expected_sources:
      - corpus/loyalty/tier-rulebook.md
      - corpus/hq-pm/policy-matrix.md
      - corpus/cs-logistics/return-refund-flowchart.md
    tags:
      - R2
      - 휴면복귀
      - 명품반품
      - 별칭
  - id: Q02
    question: >-
      마케팅팀이 "다이아 등급" 이라 부르는 회원이 명품 가방을 샀고, 그 셀러는 MP 셀러다.
      이 거래의 셀러 정산은 구매 확정일 기준 며칠 뒤(D+N)에 이루어지나?
    domain_pattern: synonym_alias
    hops_required: 3
    options:
      - id: a
        text: D+30. MP 셀러의 기본 정산 주기 그대로다.
        is_correct: false
        failure_mode_tested: missed_hop
      - id: b
        text: D+44. MP 기본 D+30 에 VVIP 명품 거래의 +14 일 hold 가 더해진다.
        is_correct: true
        failure_mode_tested: null
      - id: c
        text: D+14. VVIP 명품은 기본 주기를 대체해 D+14 가 된다.
        is_correct: false
        failure_mode_tested: numeric_error
      - id: d
        text: D+21. 사입(1P) D+7 에 +14 일 hold 가 더해진 값이다.
        is_correct: false
        failure_mode_tested: wrong_relation
      - id: e
        text: 정보 부족 / 알 수 없음. MP 명품 거래의 정산일은 코퍼스에 없다.
        is_correct: false
        failure_mode_tested: retrieval_failure
    reference_reasoning: >-
      marketing _GLOSSARY("다이아 등급"=VVIP) → seller-ops settlement-faq Q3 (VVIP 명품은 기본 주기 +14 일,
      MP=D+44) → seller-agreement-annex 제3조 동일 값. 별칭 환원 후 R7 의 +14 일이 대체가 아니라 가산임을 적용.
    expected_sources:
      - corpus/marketing/_GLOSSARY.md
      - corpus/seller-ops/settlement-faq.md
      - corpus/seller-ops/seller-agreement-annex.pdf
    tags:
      - R7
      - 정산hold
      - VVIP명품
      - 별칭
  - id: Q03
    question: 베트남(VN)에서 회원이 결제할 때 디지털상품권과 BNPL(후불결제)을 쓸 수 있나?
    domain_pattern: cross_source
    hops_required: 2
    options:
      - id: a
        text: 둘 다 불가. 디지털상품권은 외환법, BNPL 은 금융법으로 VN 에서 모두 미허용이다.
        is_correct: true
        failure_mode_tested: null
      - id: b
        text: 디지털상품권은 가능하지만 BNPL 만 금융법으로 불가하다.
        is_correct: false
        failure_mode_tested: missed_hop
      - id: c
        text: BNPL 은 가능하지만 디지털상품권만 외환법으로 불가하다.
        is_correct: false
        failure_mode_tested: missed_hop
      - id: d
        text: 둘 다 가능. VN 은 5 개 운영국이므로 본사 공통 결제 카탈로그를 그대로 따른다.
        is_correct: false
        failure_mode_tested: overgeneralization
      - id: e
        text: 정보 부족 / 알 수 없음. VN 결제수단 규제는 코퍼스에 없다.
        is_correct: false
        failure_mode_tested: retrieval_failure
    reference_reasoning: >-
      global-pm country-policy-matrix §4-5 (VN 디지털상품권/BNPL 둘 다 미허용) ↔ legal-risk risk-checklist §8
      결제수단 매트릭스(VN BNPL/선불 디지털상품권 불가, R9). 두 부서가 같은 R9 결론을 명시.
    expected_sources:
      - corpus/global-pm/country-policy-matrix.md
      - corpus/legal-risk/risk-checklist.md
    tags:
      - R9
      - VN결제규제
  - id: Q04
    question: >-
      한 B2B 엔터프라이즈 주문에 CPN-B2B 쿠폰을 여러 장 쌓아 누적 할인율이 35% 가 되었다.
      이 stacking 은 어떻게 처리되나?
    domain_pattern: single_doc
    hops_required: 1
    options:
      - id: a
        text: 정상 적용된다. CPN-B2B 끼리는 중복이 허용되므로 누적 35% 도 그대로 적용된다.
        is_correct: false
        failure_mode_tested: missed_hop
      - id: b
        text: 누적 30% 상한을 초과하므로 마지막 쿠폰부터 자동 차단되어 30% 이하만 적용된다.
        is_correct: true
        failure_mode_tested: null
      - id: c
        text: 누적 상한 20% 를 넘었으므로 전체 쿠폰이 무효화된다.
        is_correct: false
        failure_mode_tested: numeric_error
      - id: d
        text: B2C 쿠폰과 혼용된 것으로 간주되어 B2C 쿠폰만 무효화된다.
        is_correct: false
        failure_mode_tested: wrong_relation
      - id: e
        text: 정보 부족 / 알 수 없음. B2B 쿠폰 누적 상한이 코퍼스에 명시되지 않았다.
        is_correct: false
        failure_mode_tested: retrieval_failure
    reference_reasoning: >-
      b2b b2b-coupon-policy §2 (B2B stacking 3 원칙: 끼리 허용, B2C 결합 금지, 누적 상한 30%, 초과 시 마지막
      쿠폰부터 자동 차단). 35% 는 30% 초과이므로 30% 이하가 될 때까지 떨궈낸다.
    expected_sources:
      - corpus/b2b/b2b-coupon-policy.md
    tags:
      - R5
      - B2B쿠폰
      - 누적상한
