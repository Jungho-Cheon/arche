dataset_id: commerce-verbose-20260618
domain: 종합 이커머스 정책 (가상 플랫폼 오로라마켓 — 5 개국 운영, 회원 등급 5 종, 셀러 3 종, 카테고리 8 종)
language: ko
author: opentology-eval
created_at: "2026-06-19"
description: |
  Opentology MVP 검증용 비정형 정책 문서 코퍼스.
  8 개 부서 (본사 정책 / 글로벌 확장 / 마케팅 / 셀러 운영 / CS 물류 / 법무 리스크 /
  로열티 등급 / B2B 엔터프라이즈) 가 같은 가상 세계를 각자 시점에서 묘사한다.
  같은 회원 등급을 부서마다 다른 별칭으로 부르고 (VIP = 프리미엄 멤버 = 골드 등급 =
  V 회원 등), 정답 근거가 한 문서에 모이지 않고 여러 부서 문서에 흩어지도록 설계해
  청크 벡터 RAG 를 어렵게 하고 그래프 탐색의 이점을 측정한다.
  교차 도메인 규칙 R1-R10 (주류 연령 / 명품 반품 / 신선식품 환불 / BNPL 결합 /
  쿠폰 스태킹 / GDPR / 정산 주기 / JIS 인증 / VN 결제 규제 / 블랙프라이데이 캠페인)
  이 정답의 단일 진실이다.
