[project]
name = "arche-eval"
version = "0.1.0"
description = "Arche MVP 3-way 비교 측정 하니스 (full-context / chunk RAG / arche)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "rich>=13.7.0",
    # WHY pypdf: PDF 텍스트 + 임베디드 이미지 추출. apps/api 와 동일 라이브러리
    # (BSD-3, 순수 Python). eval 의 PDF 어댑터는 코어와 *입력 → 출력 형태가
    # 같아야* 측정 통제 변수가 보존된다 (ADR-0001 D3).
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "respx>=0.21.0",
]

[project.scripts]
arche-eval = "arche_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arche_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: end-to-end test that hits real OpenAI API (set RUN_LIVE_TESTS=1 to enable)",
    "integration: integration tests using FastAPI TestClient + FakeGraph (no real network)",
]
