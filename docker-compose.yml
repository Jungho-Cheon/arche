# WHY 단일 compose: ADR-0004 D1 의 "별도 벡터 DB 서비스 미도입" + walking
# skeleton 사양의 두 서비스 (neo4j + api) 만. 추후 MCP 어댑터 (#7) 가 추가되어도
# 같은 compose 에 들어가는 게 운영 무게 면에서 합리적.

services:
  opentology-neo4j:
    image: neo4j:5.13-community
    container_name: opentology-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      # NEO4J_AUTH 가 단일 문자열 (user/password). .env 의 NEO4J_PASSWORD 사용.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-opentology}"
      # vector index 는 5.13 community 부터 GA.
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-opentology} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  opentology-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: opentology-api
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      NEO4J_URI: "bolt://opentology-neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-opentology}"
      OPENTOLOGY_API_LLM_MODEL: "${OPENTOLOGY_API_LLM_MODEL:-openai/gpt-4.1}"
      OPENTOLOGY_API_EMBEDDING_MODEL: "${OPENTOLOGY_API_EMBEDDING_MODEL:-openai/text-embedding-3-small}"
    depends_on:
      opentology-neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status==200 else 1)\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  neo4j-data:
  neo4j-logs:
